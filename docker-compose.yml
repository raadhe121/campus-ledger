services:
  postgres:
    image: postgres:16-alpine
    container_name: campus-ledger-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: campus_ledger
      POSTGRES_PASSWORD: campus_ledger
      POSTGRES_DB: campus_ledger
    ports:
      - "5432:5432"
    volumes:
      - campus_ledger_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus_ledger"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: campus-ledger-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  campus_ledger_pgdata:
